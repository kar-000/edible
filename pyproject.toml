[project]
name = "edible"
version = "0.1.0"
description = "AI-powered wild berry & foraging identification app (educational tool)"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "Pillow>=10.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "responses>=0.25",
    "ruff>=0.4",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
ml = [
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]
labeling = [
    "label-studio>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edible"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/edible --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["src/edible"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
